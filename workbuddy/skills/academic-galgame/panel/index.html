<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学术galgame · 实时面板</title>
<style>
  :root{
    --bg:#061018; --panel:rgba(16,41,60,.72); --line:rgba(120,220,255,.18);
    --text:#e8f6ff; --muted:#8fb3c7; --cyan:#57e0ff; --cyan-dim:#2a9fc4;
    --gold:#ffd479; --pink:#ff8fb1; --green:#6ee7a8; --red:#ff6b81;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1100px 620px at 18% -12%, #12354d 0%, var(--bg) 62%) fixed;
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:grid; place-items:center; padding:18px;
  }
  .wrap{width:min(920px,100%); display:flex; flex-direction:column; gap:12px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:17px;letter-spacing:.4px}
  .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .right{display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
  .chip b{color:var(--text)}
  .chip.off{border-color:rgba(214,72,96,.55);color:#e78a99}

  main{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
  .stage{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px;
    background:linear-gradient(180deg,rgba(87,224,255,.06),transparent 55%),var(--panel);
    display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
  .glow{position:absolute;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(87,224,255,.2),transparent 68%);filter:blur(6px);
    animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
  .sprite{position:relative;width:256px;height:256px;background-repeat:no-repeat;background-position:0 0;
    transform:scale(.9);filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));transition:filter .3s}
  .sprite.hop{animation:hop .5s ease}
  @keyframes hop{0%,100%{transform:scale(.9) translateY(0)}40%{transform:scale(.94) translateY(-12px)}}
  .sprite.sad{animation:sad .7s ease}
  @keyframes sad{0%,100%{transform:scale(.9) rotate(0)}30%{transform:scale(.88) rotate(-4deg)}70%{transform:scale(.9) rotate(3deg)}}
  .caption{display:flex;gap:10px;font-size:12.5px}
  .caption .mood{color:var(--cyan)}
  .caption .tier{color:var(--muted)}

  .panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;
    display:flex;flex-direction:column;gap:10px}
  .stat-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .stat-head b{color:var(--text);font-variant-numeric:tabular-nums}
  .stat-head b.flash-up{animation:flashUp .9s ease}
  .stat-head b.flash-down{animation:flashDown .9s ease}
  @keyframes flashUp{0%{color:var(--green);text-shadow:0 0 12px var(--green)}100%{color:var(--text);text-shadow:none}}
  @keyframes flashDown{0%{color:var(--red);text-shadow:0 0 12px var(--red)}100%{color:var(--text);text-shadow:none}}
  .bar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
  .fill{display:block;height:100%;width:0;border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .fill.hp{background:linear-gradient(90deg,var(--green),#3fbf87)}
  .fill.hp.low{background:linear-gradient(90deg,var(--red),#b83b52);animation:danger 1s infinite}
  @keyframes danger{0%,100%{opacity:1}50%{opacity:.55}}
  .fill.fav{background:linear-gradient(90deg,var(--pink),var(--gold))}
  .fill.sub{background:linear-gradient(90deg,var(--cyan-dim),var(--cyan))}

  .title{margin:4px 0 0;font-size:12.5px;color:var(--cyan);letter-spacing:.4px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .subject .head{display:flex;justify-content:space-between;font-size:12px}
  .subject .head .name{color:var(--text)}
  .subject .head .val{color:var(--muted);font-variant-numeric:tabular-nums}
  .subject .chain{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:3px}
  .subject .chain .done{color:var(--gold)}
  .subject .bar{height:6px;margin-top:4px}
  .subject.conquered .name::after{content:" ★";color:var(--gold)}
  .subject.new{animation:riseIn .5s ease}
  @keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .log li{font-size:11.5px;color:var(--muted);line-height:1.5;padding-left:10px;position:relative;animation:riseIn .35s ease}
  .log li::before{content:"•";position:absolute;left:0;color:var(--cyan-dim)}
  .log li .s{color:var(--cyan)}

  .battle{border:1px solid rgba(255,107,129,.35);border-radius:12px;padding:12px 14px;
    background:linear-gradient(180deg,rgba(255,107,129,.12),rgba(6,16,24,.9));
    display:none;flex-direction:column;gap:8px;animation:riseIn .35s ease}
  .battle.on{display:flex}
  .battle .enemy{display:flex;align-items:baseline;gap:10px}
  .battle .enemy .n{font-size:16px;font-weight:700;color:var(--red)}
  .battle .enemy .t{font-size:11.5px;color:var(--muted)}
  .battle .fill.enemy{background:linear-gradient(90deg,var(--red),#b83b52)}
  .meta{display:flex;gap:8px;flex-wrap:wrap}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

  .hint{font-size:11px;color:var(--muted);text-align:center}

  /* ── 视图切换：实时学科 / 回合回放 / 学习报告 ── */
  .tabs{display:flex;gap:6px;margin-top:4px}
  .tabs button{
    flex:1; padding:6px 8px; font-size:12px; cursor:pointer; font-family:inherit;
    border:1px solid var(--line); border-radius:8px; background:rgba(0,0,0,.22); color:var(--muted);
  }
  .tabs button.on{color:var(--text); border-color:var(--cyan-dim); background:rgba(87,224,255,.12)}
  .pane{display:none}
  .pane.on{display:block; animation:riseIn .3s ease}

  /* ── 回合回放 ── */
  .replay-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .replay-ctl button{
    padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--text);
    border:1px solid var(--line); border-radius:8px; background:rgba(0,0,0,.25);
  }
  .replay-ctl button:hover{border-color:var(--cyan-dim)}
  .replay-ctl button:disabled{opacity:.35;cursor:default}
  .replay-pos{font-size:11.5px;color:var(--muted);margin-left:auto}
  .replay-card{
    border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:rgba(0,0,0,.22);
    min-height:74px;
  }
  .replay-card .who{font-size:11.5px;color:var(--cyan);margin-bottom:5px}
  .replay-card .note{font-size:12.5px;line-height:1.6}
  .replay-card .deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .d{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
  .d.up{color:var(--green);border-color:rgba(110,231,168,.4)}
  .d.down{color:var(--red);border-color:rgba(255,107,129,.4)}
  .replay-snap{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.7}
  .replay-snap b{color:var(--text)}
  .track{height:5px;border-radius:999px;background:rgba(255,255,255,.08);margin:9px 0 0;overflow:hidden}
  .track i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));width:0;transition:width .25s}

  /* ── 学习报告 ── */
  .rep-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:9px}
  .rep-cell{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:rgba(0,0,0,.2)}
  .rep-cell .k{font-size:10.5px;color:var(--muted)}
  .rep-cell .v{font-size:15px;margin-top:2px}
  .rep-cell .v small{font-size:11px;color:var(--muted)}
  .rep-title{font-size:11.5px;color:var(--cyan);margin:9px 0 5px}
  .rep-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px dashed rgba(120,220,255,.12)}
  .rep-row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rep-row .v{color:var(--muted);font-size:11.5px}
  .rep-empty{font-size:11.5px;color:var(--muted)}
  .rep-note{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:6px}
  .bar.slim{height:4px;margin-top:3px}
  @media(max-width:760px){ main{grid-template-columns:1fr} .sprite{transform:scale(.78)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🐋 学术galgame · 实时面板</h1>
      <div class="sub">Agent 在对话里推进游戏 · 这里自动更新并播放动画</div>
    </div>
    <div class="right">
      <span class="chip">Lv.<b id="level">1</b></span>
      <span class="chip" id="src-chip">—</span>
      <span class="dot" id="dot" title="连接状态"></span>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="glow"></div>
      <div class="sprite" id="sprite"></div>
      <div class="caption"><span class="mood" id="mood">平静</span><span class="tier" id="tier">好感档位 0</span></div>
    </section>

    <section class="panel">
      <div>
        <div class="stat-head"><span>HP</span><b id="hp">100 / 100</b></div>
        <div class="bar"><i class="fill hp" id="hpbar"></i></div>
      </div>
      <div>
        <div class="stat-head"><span>好感度</span><b id="fav">0</b></div>
        <div class="bar"><i class="fill fav" id="favbar"></i></div>
      </div>

      <div class="battle" id="battle">
        <div class="enemy"><span class="n" id="e-name">魔将</span><span class="t" id="e-title"></span></div>
        <div class="stat-head"><span>敌方 HP</span><b id="e-hp">15 / 15</b></div>
        <div class="bar"><i class="fill enemy" id="e-bar"></i></div>
        <div class="meta">
          <span class="chip" id="e-subject">—</span>
          <span class="chip" id="e-diff">难度 1</span>
          <span class="chip" id="e-streak">连对 0</span>
        </div>
      </div>

      <div class="tabs">
        <button id="tab-live" class="on">学科</button>
        <button id="tab-replay">回合回放</button>
        <button id="tab-report">学习报告</button>
      </div>

      <div class="pane on" id="pane-live">
        <h2 class="title">学科熟练度</h2>
        <ul id="subjects"></ul>
        <h2 class="title">近期记录</h2>
        <ul class="log" id="log"></ul>
      </div>

      <div class="pane" id="pane-replay">
        <h2 class="title">回合回放<span class="rep-note" id="replay-scope"></span></h2>
        <div class="replay-ctl">
          <button id="rp-first" title="回到最早">⏮</button>
          <button id="rp-prev">上一步</button>
          <button id="rp-play">▶ 播放</button>
          <button id="rp-next">下一步</button>
          <button id="rp-last" title="跳到最新">⏭</button>
          <span class="replay-pos" id="rp-pos">—</span>
        </div>
        <div class="replay-card" id="rp-card">
          <div class="who" id="rp-who">还没有可回放的回合</div>
          <div class="note" id="rp-note">先让鲸鱼娘考你一题，这里就会出现回放。</div>
          <div class="deltas" id="rp-deltas"></div>
          <div class="replay-snap" id="rp-snap"></div>
        </div>
        <div class="track"><i id="rp-track"></i></div>
      </div>

      <div class="pane" id="pane-report">
        <h2 class="title">学习报告<span class="rep-note" id="rep-scope"></span></h2>
        <div class="rep-grid" id="rep-grid"></div>
        <div class="rep-title">各学科</div>
        <div id="rep-subjects"></div>
        <div class="rep-title">需要巩固的点</div>
        <div id="rep-weak"></div>
      </div>
    </section>
  </main>

  <div class="hint" id="hint">等待 Agent 推进…</div>
</div>

<script>
const FRAME = 256
const MOOD = { idle:'平静', joy:'开心', celebrate:'庆祝', disappointed:'失落', think:'思考',
               error:'惊慌', working:'努力', play:'玩耍', eat:'进食', sleep:'休息', walk:'散步', welcome:'欢迎', wait:'等待', wake:'醒来', drag:'被拖走' }
const $ = (id) => document.getElementById(id)
const prev = { hp:null, fav:null, level:null, subjects:{}, battle:null }

let spriteTimer = null, currentKey = ''
function setSprite(key, frames){
  const k = key || 'idle', n = Math.max(1, frames || 1)
  if (currentKey === k + ':' + n && spriteTimer) return
  currentKey = k + ':' + n
  const el = $('sprite')
  el.style.backgroundImage = `url(./assets/whale-girl/${k}.png)`
  el.style.backgroundSize = `${n*FRAME}px ${FRAME}px`
  el.style.backgroundPositionX = '0px'
  if (spriteTimer) { clearInterval(spriteTimer); spriteTimer = null }
  if (n <= 1) return
  let f = 0
  spriteTimer = setInterval(() => { f = (f+1)%n; el.style.backgroundPositionX = `${-f*FRAME}px` }, 220)
}
function play(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls) }
function flash(el, dir, text){
  if (!el) return
  const before = el.textContent
  el.textContent = text
  if (before !== text) play(el, dir === 'up' ? 'flash-up' : 'flash-down')
}

function render(d){
  const g = d.game
  $('dot').classList.remove('off')
  $('hint').textContent = '已连接 · 存档 ' + (d.save || '')

  // 等级 / HP / 好感：变化时高亮
  flash($('level'), 'up', String(g.level))
  const hpTxt = g.player.hp + ' / ' + g.player.maxHp
  const hpDir = prev.hp === null || g.player.hp === prev.hp ? null : (g.player.hp > prev.hp ? 'up' : 'down')
  if (hpDir) flash($('hp'), hpDir, hpTxt); else $('hp').textContent = hpTxt
  $('hpbar').style.width = Math.round(g.player.hp / g.player.maxHp * 100) + '%'
  $('hpbar').classList.toggle('low', g.player.hp / g.player.maxHp <= 0.3)

  const favDir = prev.fav === null || g.whale.favorability === prev.fav ? null : (g.whale.favorability > prev.fav ? 'up' : 'down')
  if (favDir) flash($('fav'), favDir, String(g.whale.favorability)); else $('fav').textContent = String(g.whale.favorability)
  $('favbar').style.width = g.whale.favorability + '%'
  if (favDir) play($('sprite'), favDir === 'up' ? 'hop' : 'sad')

  $('mood').textContent = MOOD[g.mood] || MOOD.idle
  $('tier').textContent = '好感档位 ' + g.whaleTier
  setSprite(g.imageKey, g.imageFrames)
  // 数据源小标签：ima（必填）+ LLM 模式（自备 API / WorkBuddy 积分）
  const imaTxt = d.ima && d.ima.configured ? 'ima 已接' : 'ima 未接'
  const matTxt = d.materials && d.materials.count ? ('教材 ' + d.materials.count + ' 份') : '无教材'
  const llmTxt = d.llm && d.llm.configured ? '自备 API' : 'WB 积分'
  const chip = $('src-chip')
  chip.textContent = imaTxt + ' · ' + matTxt + ' · ' + llmTxt
  chip.classList.toggle('off', !(d.ima && d.ima.configured))

  // 学科
  const ul = $('subjects'); ul.innerHTML = ''
  for (const [name, v] of Object.entries(g.subjects || {})) {
    const q = v.quest || {}
    const li = document.createElement('li')
    li.className = 'subject' + (v.conquered ? ' conquered' : '') + (prev.subjects[name] === undefined ? ' new' : '')
    li.innerHTML = `
      <div class="head"><span class="name">${esc(name)}</span><span class="val">${v.mastery} / 100</span></div>
      <div class="bar"><i class="fill sub" style="width:${v.mastery}%"></i></div>
      <div class="chain">
        <span class="${q.lord?'done':''}">领主${q.lord?'✓':'✗'}</span>
        <span class="${q.general?'done':''}">魔将${q.general?'✓':'✗'}</span>
        <span class="${v.conquered?'done':''}">魔王${v.conquered?'✓':'✗'}</span>
      </div>`
    ul.appendChild(li)
    prev.subjects[name] = v.mastery
  }

  // 战斗
  const b = d.battle
  const box = $('battle')
  if (b) {
    box.classList.add('on')
    $('e-name').textContent = b.enemyName
    $('e-title').textContent = b.enemyTitle
    $('e-hp').textContent = b.enemyInfinite ? '∞' : (b.enemyHp + ' / ' + b.enemyMaxHp)
    $('e-bar').style.width = b.enemyInfinite ? '100%' : Math.round(b.enemyHp / Math.max(1,b.enemyMaxHp) * 100) + '%'
    $('e-subject').textContent = b.subject
    $('e-diff').textContent = '难度 ' + b.difficulty
    $('e-streak').textContent = '连对 ' + b.correctStreak
    if (prev.battle && b.enemyHp < prev.battle.enemyHp) play(box, 'shake')
    prev.battle = { enemyHp: b.enemyHp }
  } else {
    box.classList.remove('on'); prev.battle = null
  }

  // 日志
  const log = $('log'); log.innerHTML = ''
  for (const e of (g.log || []).slice(0, 6)) {
    const li = document.createElement('li')
    li.innerHTML = (e.subject ? `<span class="s">[${esc(e.subject)}]</span> ` : '') + esc(e.note)
    log.appendChild(li)
  }

  prev.hp = g.player.hp; prev.fav = g.whale.favorability; prev.level = g.level

  // 回放 / 报告：只在对应视图打开时才算，省得每次轮询都白做一遍
  lastState = d
  if (activeTab === 'pane-replay') rpRebuild(d)
  else if (activeTab === 'pane-report') renderReport(d)
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

/* ══════════ 视图切换 ══════════ */
const TABS = [['tab-live','pane-live'], ['tab-replay','pane-replay'], ['tab-report','pane-report']]
let activeTab = 'pane-live'
for (const [tabId, paneId] of TABS) {
  $(tabId).addEventListener('click', () => {
    activeTab = paneId
    for (const [t, p] of TABS) {
      $(t).classList.toggle('on', p === paneId)
      $(p).classList.toggle('on', p === paneId)
    }
    if (paneId === 'pane-replay') rpRebuild(lastState)
    if (paneId === 'pane-report') renderReport(lastState)
  })
}

/* ══════════ 回合回放 ══════════
 *
 * 每轮结算时引擎会在日志里记下**实际生效的增量**（mastery/favor/hp，已考虑 clamp）。
 * 于是可以反推：某一轮之前的值 = 当前值 − 这一轮之后所有增量之和。
 * 从可见窗口的最早一轮往前推、再逐轮正推，就能逐步重现每一轮结束时的数值。
 *
 * 注意这是「最近 N 轮」的回放：日志上限 50 条、面板取 40 条，
 * 更早的历史没有被记录，所以基线是「N 轮之前」，界面上会写清楚。
 */
let lastState = null
const rp = { turns: [], idx: 0, timer: null, scope: 0 }

function buildTurns(g) {
  const hist = (g.history && g.history.length ? g.history : (g.log || [])).slice()
  const turns = hist.reverse()                       // 日志是新→旧，回放要旧→新
  // 反推基线
  const base = { fav: g.whale.favorability, hp: g.player.hp, sub: {} }
  for (const [n, v] of Object.entries(g.subjects || {})) base.sub[n] = v.mastery
  for (const t of turns) {
    if (t.subject && typeof t.mastery === 'number') base.sub[t.subject] = (base.sub[t.subject] ?? 0) - t.mastery
    if (typeof t.favor === 'number') base.fav -= t.favor
    if (typeof t.hp === 'number') base.hp -= t.hp
  }
  // 正推，记下每一轮结束时的快照
  const snap = { fav: base.fav, hp: base.hp, sub: { ...base.sub } }
  return turns.map((t) => {
    if (t.subject && typeof t.mastery === 'number') snap.sub[t.subject] = (snap.sub[t.subject] ?? 0) + t.mastery
    if (typeof t.favor === 'number') snap.fav += t.favor
    if (typeof t.hp === 'number') snap.hp += t.hp
    return { ...t, after: { fav: snap.fav, hp: snap.hp, sub: { ...snap.sub } } }
  })
}

function rpRebuild(g) {
  if (!g) return
  const atLatest = rp.idx >= rp.turns.length - 1 || !rp.turns.length
  rp.turns = buildTurns(g)
  rp.idx = rp.turns.length ? (atLatest ? rp.turns.length - 1 : Math.min(rp.idx, rp.turns.length - 1)) : 0
  $('replay-scope').textContent = rp.turns.length
    ? `最近 ${rp.turns.length} 轮（更早的没有记录，回放不出来）` : ''
  rpDraw()
}

function rpDraw() {
  const n = rp.turns.length
  const has = n > 0
  for (const id of ['rp-first', 'rp-prev', 'rp-play', 'rp-next', 'rp-last']) $(id).disabled = !has
  if (!has) {
    $('rp-pos').textContent = '—'
    $('rp-track').style.width = '0%'
    return
  }
  const t = rp.turns[Math.min(rp.idx, n - 1)]
  $('rp-pos').textContent = `第 ${rp.idx + 1} / ${n} 轮`
  $('rp-track').style.width = Math.round((rp.idx + 1) / n * 100) + '%'

  const when = t.at ? new Date(t.at).toLocaleTimeString('zh-CN', { hour12: false }) : ''
  $('rp-who').textContent = (t.subject ? `[${t.subject}] ` : '') + when
  $('rp-note').textContent = t.note || '(无备注)'

  const ds = []
  if (typeof t.mastery === 'number' && t.mastery !== 0) {
    ds.push(`<span class="d ${t.mastery > 0 ? 'up' : 'down'}">熟练度 ${t.mastery > 0 ? '+' : ''}${t.mastery}</span>`)
  }
  if (typeof t.favor === 'number' && t.favor !== 0) {
    ds.push(`<span class="d ${t.favor > 0 ? 'up' : 'down'}">好感 ${t.favor > 0 ? '+' : ''}${t.favor}</span>`)
  }
  if (typeof t.hp === 'number' && t.hp !== 0) {
    ds.push(`<span class="d ${t.hp > 0 ? 'up' : 'down'}">HP ${t.hp > 0 ? '+' : ''}${t.hp}</span>`)
  }
  if (t.mood) ds.push(`<span class="d">心情 ${MOOD[t.mood] || t.mood}</span>`)
  $('rp-deltas').innerHTML = ds.join('') || '<span class="d">这一轮没有数值变化</span>'

  const a = t.after
  const subs = Object.entries(a.sub).filter(([, v]) => v > 0)
    .sort((x, y) => y[1] - x[1]).slice(0, 3)
    .map(([k, v]) => `${esc(k)} <b>${v}</b>`).join(' · ')
  $('rp-snap').innerHTML = `这一轮结束时：${subs || '（各科都是 0）'} ｜ 好感 <b>${a.fav}</b> ｜ HP <b>${a.hp}</b>`
}

function rpStop() { if (rp.timer) { clearInterval(rp.timer); rp.timer = null } $('rp-play').textContent = '▶ 播放' }
$('rp-first').onclick = () => { rpStop(); rp.idx = 0; rpDraw() }
$('rp-prev').onclick = () => { rpStop(); rp.idx = Math.max(0, rp.idx - 1); rpDraw() }
$('rp-next').onclick = () => { rpStop(); rp.idx = Math.min(rp.turns.length - 1, rp.idx + 1); rpDraw() }
$('rp-last').onclick = () => { rpStop(); rp.idx = rp.turns.length - 1; rpDraw() }
$('rp-play').onclick = () => {
  if (rp.timer) { rpStop(); return }
  if (!rp.turns.length) return
  if (rp.idx >= rp.turns.length - 1) rp.idx = 0     // 已到末尾就从头放
  $('rp-play').textContent = '⏸ 暂停'
  rpDraw()
  rp.timer = setInterval(() => {
    if (rp.idx >= rp.turns.length - 1) { rpStop(); return }
    rp.idx++; rpDraw()
  }, 900)
}

/* ══════════ 学习报告 ══════════ */
function fmtSpan(ms) {
  const m = Math.round(ms / 60000)
  if (m < 1) return '不到 1 分钟'
  if (m < 60) return m + ' 分钟'
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分'
}

function renderReport(d) {
  if (!d) return
  const g = d.game
  const hist = (g.history && g.history.length ? g.history : (g.log || []))
  const rounds = hist.filter((t) => typeof t.mastery === 'number' || typeof t.favor === 'number')
  const good = rounds.filter((t) => (t.mastery || 0) > 0)
  const weak = rounds.filter((t) => (t.mastery || 0) < 0)
  const gain = rounds.reduce((s, t) => s + (t.mastery || 0), 0)

  const stamps = hist.map((t) => t.at).filter(Boolean).sort()
  const span = stamps.length > 1 ? stamps[stamps.length - 1] - stamps[0] : 0

  const rate = rounds.length ? Math.round(good.length / rounds.length * 100) : 0
  const cells = [
    ['教学轮次', `${rounds.length} <small>轮</small>`],
    ['判定正确率', rounds.length ? `${rate}<small>%</small>` : '—'],
    ['累计熟练度', `${g.totalMastery} <small>· Lv.${g.level}</small>`],
    ['好感度', `${g.whale.favorability} <small>· 档位 ${g.whaleTier}</small>`],
    ['这窗口的净增', `${gain >= 0 ? '+' : ''}${gain} <small>熟练</small>`],
    ['记录跨度', span ? fmtSpan(span) : '—'],
  ]
  $('rep-grid').innerHTML = cells.map(([k, v]) =>
    `<div class="rep-cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')

  // 各学科：熟练度 + 窗口内轮次 / 净增
  const per = {}
  for (const t of rounds) {
    if (!t.subject) continue
    const p = per[t.subject] || (per[t.subject] = { n: 0, gain: 0 })
    p.n++; p.gain += (t.mastery || 0)
  }
  const names = Object.keys(g.subjects || {}).sort((a, b) => (g.subjects[b].mastery) - (g.subjects[a].mastery))
  $('rep-subjects').innerHTML = names.map((n) => {
    const v = g.subjects[n]
    const p = per[n] || { n: 0, gain: 0 }
    const q = v.quest || {}
    return `<div class="rep-row"><span class="n">${esc(n)}${v.conquered ? ' ★' : ''}</span>`
      + `<span class="v">${p.n} 轮 · ${p.gain >= 0 ? '+' : ''}${p.gain}</span>`
      + `<span class="v" style="width:64px;text-align:right">${v.mastery}/100</span></div>`
      + `<div class="bar slim"><i class="fill sub" style="width:${v.mastery}%"></i></div>`
      + `<div class="rep-row" style="border:0;padding-top:2px"><span class="n" style="font-size:11px;color:var(--muted)">`
      + `领主${q.lord ? '✓' : '✗'} · 魔将${q.general ? '✓' : '✗'} · 魔王${v.conquered ? '✓' : '✗'}</span></div>`
  }).join('') || '<div class="rep-empty">还没有学科</div>'

  // 需要巩固：这一窗口里判为「没掌握」的那些轮
  $('rep-weak').innerHTML = weak.length
    ? weak.slice(-8).reverse().map((t) =>
        `<div class="rep-row"><span class="n">${t.subject ? `<span class="s">[${esc(t.subject)}]</span> ` : ''}${esc(t.note)}</span>`
        + `<span class="v">${t.mastery}</span></div>`).join('')
    : '<div class="rep-empty">这个窗口里没有判定失败的回合 —— 保持住。</div>'
  $('rep-scope').textContent = `统计窗口：最近 ${hist.length} 条记录`
}

async function poll(){
  try {
    const r = await fetch('./api/state', { cache: 'no-store' })
    render(await r.json())
  } catch (e) {
    $('dot').classList.add('off')
    $('hint').textContent = '连接中断，重试中…'
  }
}
setSprite('idle', 3)
poll()
setInterval(poll, 800)
</script>
